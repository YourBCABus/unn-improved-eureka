[package]
name = "improved-eureka"
version = "0.2.0"
edition = "2021"
default-run = "improved-eureka"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dotenvy = "0.15"
arcs-env-rs = "0.1"
arcs-logging-rs = "0.2"

actix-web = { version = "4", features = ["rustls"] }

chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
hmac = "0.12"
paste = "1"
tokio = { version = "1", features = ["macros", "rt", "full"] }

uuid = { version = "1", features = ["v4", "serde"] }

serde = "1"
serde_json = "1"

sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls", "uuid"] }

async-graphql = { version = "7", features = ["uuid", "chrono", "tokio"] }
async-graphql-actix-web = "7"
async-graphql-value = "7"
constant_time_eq = "0.3"

reqwest = { version = "^0.12.9", features = ["json", "rustls-tls"], default-features = false }
sha256 = "1"
rand = "0.8"

rpassword = "7"
futures-util = "0.3"
actix-cors = "0.7"
base64 = "0.22"
jsonwebtoken = { version = "9.3.0", default-features = false }
regex = "1.10.5"

yenowa-errors = { git = "https://github.com/YourBCABus/yenowa-errors.git", default-features = false, features = ["env", "rustls"]}
futures = "0.3.31"

[profile.release]
opt-level = 3
lto = "thin"

[profile.release-final]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1

[profile.release-minimum]
inherits = "release-final"
opt-level = "z"

